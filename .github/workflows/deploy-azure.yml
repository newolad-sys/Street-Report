# Compila el frontend (React/Vite), lo empaqueta dentro del backend (Spring Boot)
# y publica target/app.jar en Azure App Service cada vez que hay push a main.
name: Desplegar en Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  id-token: write # necesario para iniciar sesión en Azure con OIDC (sin contraseñas)
  contents: read

env:
  AZURE_WEBAPP_NAME: street-report-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copiar frontend compilado al backend
        run: |
          mkdir -p backend/src/main/resources/static
          cp -r frontend/dist/* backend/src/main/resources/static/

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
          cache: maven

      - name: Pruebas y empaquetado del backend
        working-directory: backend
        run: mvn -B package # corre las pruebas (perfil h2) y genera target/app.jar

      - name: Guardar el jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: backend/target/app.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Descargar el jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Iniciar sesión en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publicar en App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: app.jar
