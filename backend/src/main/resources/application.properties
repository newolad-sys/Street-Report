# Configuración por defecto: PostgreSQL local (docker-compose).
# En Azure se sobrescribe con variables de entorno del App Service (nunca con secretos en el repo).
spring.application.name=street-report-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reportes}
spring.datasource.username=${DB_USER:reportes}
spring.datasource.password=${DB_PASSWORD:reportes}

# "update" crea/ajusta las tablas automáticamente. Suficiente para el proyecto académico.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Carga datos de ejemplo al arrancar si la tabla está vacía (SEED_DATA=true)
app.seed-data=${SEED_DATA:false}

# Fotos de los reportes en Azure Blob Storage. Sin cadena de conexión, POST /api/fotos responde 503.
app.fotos.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
app.fotos.contenedor=${AZURE_STORAGE_CONTAINER:fotos}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
